BUILT_MODULE_LOCATION[0]="src/"

DEST_MODULE_LOCATION[1]="/kernel/lib/"
BUILT_MODULE_NAME[1]="acer_wmi"
BUILT_MODULE_LOCATION[1]="src/backends/acer/"

DEST_MODULE_LOCATION[2]="/kernel/lib/"
BUILT_MODULE_NAME[2]="acer_acpi"
BUILT_MODULE_LOCATION[2]="src/backends/acer/"

DEST_MODULE_LOCATION[3]="/kernel/lib/"
BUILT_MODULE_NAME[3]="acer_io"
