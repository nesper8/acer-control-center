[package]
name = "acer-control-center"
version = "0.1.0"
edition = "2024"
authors = ["Stanly Silas <vstanlysilas@gmail.com>"]
license = "GPL-3.0-or-later"
description = "Native Linux control center for Acer gaming laptops"
repository = "https://github.com/stanlysilas/acer-control-center"
rust-version = "1.88"
build = "build.rs"

[dependencies]
zbus = { version = "5", features = ["blocking"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_7"] }
gtk = { package = "gtk4", version = "0.10", features = ["v4_18"] }
glib = "0.21"
gio = "0.21"
gdk = { package = "gdk4", version = "0.10" }

anyhow = "1.0"
thiserror = "2.0"

libc = "0.2"

log = "0.4"
env_logger = "0.11"

once_cell = "1.21"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
