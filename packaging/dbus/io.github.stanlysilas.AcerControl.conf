<?xml version="1.0"?>

<!DOCTYPE busconfig PUBLIC
"-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
"http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<busconfig>

    <policy user="root">

        <allow own="io.github.stanlysilas.AcerControl"/>

        <allow send_destination="io.github.stanlysilas.AcerControl"/>

    </policy>

    <policy context="default">

        <allow send_destination="io.github.stanlysilas.AcerControl"/>

    </policy>

</busconfig>
